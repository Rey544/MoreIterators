<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>外观调整</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script><link rel="stylesheet" href="/studio-status.css"><script src="/studio-status.js"></script><link rel="stylesheet" href="/studio-theme.css"><link rel="stylesheet" href="/studio-about.css"><link rel="stylesheet" href="/voice-settings.css"><link rel="stylesheet" href="/project-actions.css"><link rel="stylesheet" href="/export-dialog.css"><link rel="stylesheet" href="/scene-assets.css"></head><body class="appearance-studio mi-studio">
<header>
 <strong class="studio-title">外观调整</strong>
 <div class="project-actions"><select id="projects" aria-label="已保存项目"></select><button id="new">新建项目</button><button id="import">导入项目</button><button id="history">历史版本</button><button id="deleteProject" class="danger" type="button" disabled>删除项目</button><details class="studio-menu"><summary>更多</summary><nav><button id="recentlyDeleted" type="button">最近删除</button></nav></details></div>
 <div class="save-actions"><button id="save">保存</button><button id="export">导出</button><button class="accent" id="apply">应用到游戏</button></div>
 <details id="otherStudios" class="studio-menu"><summary>切换页面</summary><nav aria-label="切换页面"><a href="/pearls" target="_blank">珍珠文本</a><button id="dialogueEditor">对话编辑</button><a href="/broadcasts" target="_blank">广播编辑</a><a id="projectionStudio" href="/projections" target="_blank">投影编辑</a><a id="roomStudio" href="/rooms" target="_blank">区域连接</a></nav></details>
</header>
<div id="notice" role="status" hidden></div>
<main id="workspace" aria-label="迭代器外观工作区">
 <aside id="settings" aria-label="外观分类与参数">
  <label class="name">项目名称<input id="projectName" maxlength="60"></label>
  <div id="groups"><div id="roomSettings" class="room-settings">
  <details class="settings-category" data-section-id="chamber"><summary>演算室</summary><label class="external-room-tools"><input id="externalRoomTools" type="checkbox"><span data-i18n="roomControls.externalTools">启用第三方房间编辑器工具/模组</span></label><details data-section-id="chamberPresets"><summary data-i18n="roomPresets.title">演算室预设</summary><div class="chamber-presets"><select id="chamberPreset" aria-label="演算室预设" disabled></select><label id="chamberSizeField" hidden><span data-i18n="roomPresets.size">尺寸</span><select id="chamberSize"></select></label><img id="chamberPresetPreview" alt="" hidden><button id="replaceChamberPreset" type="button" data-i18n="roomPresets.replace" disabled>替换房间</button></div></details><div class="room-edit"><div class="tools"><button id="editAI" data-i18n="roomControls.openChamberRained">在 Rained 中打开演算室</button><button id="syncAI">同步演算室</button></div></div><div id="chamberSettings"></div><p class="muted" id="identity"></p></details>
  <details class="settings-category" data-section-id="waiting"><summary>等待房间</summary><div class="room-edit"><div class="tools"><button id="editEntry" data-i18n="roomControls.openWaitingRained">在 Rained 中打开等待房间</button><button id="syncEntry">同步等待房间</button></div></div><div id="waitingSettings"></div></details></div></div>
 </aside>
 <div id="settingsDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整外观栏宽度" aria-orientation="vertical" aria-controls="settings" aria-valuemin="240" aria-valuemax="600" aria-valuenow="280" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div>
 <section class="preview" aria-labelledby="previewTitle">
  <div class="panel-heading"><h2 id="previewTitle">离线人偶</h2><div class="preview-actions">
   <details id="previewBackground" class="studio-menu"><summary>背景</summary><div class="background-panel"><select id="backgroundMode" aria-label="背景类型"><option value="solid">纯色</option><option value="checker">透明方格</option></select><div id="backgroundSpectrum"><div id="backgroundSV" role="slider" tabindex="0" aria-label="背景饱和度与明度" aria-valuemin="0" aria-valuemax="100"><span id="backgroundCursor"></span></div><input id="backgroundHue" type="range" min="0" max="360" step="1" aria-label="背景色相"></div></div></details>
   <details id="referenceGuides" class="studio-menu"><summary>参考线</summary><div class="background-panel"><label><input id="guides" type="checkbox" checked>显示参考线</label><label class="field"><span>参考线颜色</span><input id="guideColor" type="color" value="#ffffff" aria-label="参考线颜色"></label></div></details>
  </div></div>
  <div class="zoom-toolbar" role="group" aria-label="人偶视图缩放"><button id="zoomOut" class="zoom-step" aria-label="缩小人偶">−</button><input id="zoom" type="range" min=".25" max="20" value="5" step=".01" aria-label="人偶缩放"><label class="zoom-number"><input id="zoomValue" type="number" min="25" max="2000" step="1" value="500" aria-label="人偶缩放百分比"><span aria-hidden="true">%</span></label><button id="zoomIn" class="zoom-step" aria-label="放大人偶">+</button><button id="fitPreview">适合窗口</button></div>
  <div id="previewStage" class="preview-stage"><canvas id="puppet" width="580" height="600" aria-label="离线人偶预览，可拖动平移" title="拖动平移&#10;Ctrl + 滚轮缩放"></canvas></div>
  <div id="previewHeightDivider" class="workspace-height-divider" role="separator" tabindex="0" aria-label="上下拖动调整工作区高度" aria-orientation="horizontal" title="上下拖动调整高度&#10;双击恢复"></div>
 </section>
 <div id="paintDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整绘制栏宽度" aria-orientation="vertical" aria-controls="paintPanel" aria-valuemin="300" aria-valuemax="700" aria-valuenow="520" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div>
 <section id="paintPanel" class="paint" aria-labelledby="paintTitle">
  <div class="paint-split"><div class="paint-editor">
  <div class="panel-heading paint-heading"><h2 id="paintTitle">绘制素材</h2><select id="target" aria-label="绘制部位"><option value="forehead">额头纹案</option><option value="face">脸部纹案</option><option value="antennaL">左天线</option><option value="antennaR">右天线</option><option value="earL">左耳机</option><option value="earR">右耳机</option><option value="gown">长袍 UV</option><option value="sleeve">袖子 UV</option><option value="collar">领子 UV</option><option value="scarf">后围巾 UV</option></select></div>
  <div class="zoom-toolbar paint-zoom" role="group" aria-label="素材画布缩放"><button id="paintZoomOut" class="zoom-step" aria-label="缩小素材">−</button><input id="paintZoom" type="range" min=".25" max="32" value="8" step=".01" aria-label="素材缩放"><label class="zoom-number"><input id="paintZoomValue" type="number" min="25" max="3200" step="1" value="800" aria-label="素材缩放百分比"><span aria-hidden="true">%</span></label><button id="paintZoomIn" class="zoom-step" aria-label="放大素材">+</button></div>
  <div class="paint-tools" role="group" aria-label="绘画工具">
   <div class="tool-colors"><select id="brush" aria-label="画笔"><option value="pen">像素笔</option><option value="line">直线</option><option value="spray">喷枪</option><option value="grain">颗粒笔</option><option value="gradient">渐变</option><option value="erase">橡皮</option></select><input type="color" id="ink" value="#eeeeee" aria-label="画笔颜色" title="画笔颜色"><input type="color" id="ink2" value="#a4394c" aria-label="渐变终点颜色" title="渐变终点颜色"><button id="undo" title="撤销编辑（Ctrl+Z）" aria-keyshortcuts="Control+Z Meta+Z">撤销</button><button id="redo" title="重做编辑（Ctrl+Shift+Z / Ctrl+Y）" aria-keyshortcuts="Control+Shift+Z Control+Y Meta+Shift+Z">重做</button></div>
   <div class="paint-material-row"><div class="paint-toggles"><label><input type="checkbox" id="symmetry">左右对称</label><label><input id="meshGuide" type="checkbox" checked>网格与部位参考</label></div><details class="studio-menu texture-menu"><summary>素材操作</summary><div class="texture-actions"><button id="textureImport">导入 PNG 到此层</button><button id="textureExport">导出合成 PNG</button><button id="baseGradient">生成当前配色底图</button><button id="antennaShape" hidden>载入此层基础形状</button><button id="mirrorAntenna">镜像到另一侧天线</button><button id="clear" class="danger">清空此层</button></div></details></div>
  </div>
  <div class="paint-canvas-row"><div class="paint-brush-rails"><label class="paint-size-rail"><span>笔径</span><output id="sizeValue" for="size">2</output><input type="range" id="size" min="1" max="24" value="2" aria-label="笔径" aria-orientation="vertical"></label><label class="paint-size-rail paint-strength-rail"><span>浓度</span><output id="strengthValue" for="strength">100%</output><input type="range" id="strength" min=".02" max="1" step=".02" value="1" aria-label="浓度" aria-orientation="vertical"></label></div><div id="paintViewport" class="paint-wrap" tabindex="0" aria-label="素材画布，可滚动查看放大区域"><div id="paintSurface"><canvas id="paint" width="256" height="256" aria-label="像素绘制画布"></canvas></div></div></div>
  <div id="paintHeightDivider" class="workspace-height-divider" role="separator" tabindex="0" aria-label="上下拖动调整画布高度" aria-orientation="horizontal" title="上下拖动调整高度&#10;双击恢复"></div>
  </div><div id="layersDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整贴图图层栏宽度" aria-orientation="vertical" aria-controls="paintLayers" aria-valuemin="96" aria-valuemax="320" aria-valuenow="128" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div><aside id="paintLayers" class="paint-layers" aria-label="贴图图层"><div class="layer-heading"><h3>贴图图层</h3><div class="layer-actions"><button id="layerAdd" type="button" aria-label="新建图层" title="新建图层">＋</button><button id="layerDelete" type="button" aria-label="删除图层" title="删除图层">−</button></div></div><div id="layerList"></div></aside></div>
 </section>
</main>
<dialog id="newProjectDialog"><h2 data-i18n="ui.0341">新建项目</h2><label><span data-i18n="roomPresets.projectName">项目名称</span><input id="newProjectName" maxlength="60"></label><label><span data-i18n="roomPresets.title">演算室预设</span><select id="newProjectPreset"></select></label><label><span data-i18n="roomPresets.size">尺寸</span><select id="newProjectSize"></select></label><img id="newProjectPreview" alt="" hidden><div class="tools"><button id="cancelNewProject" type="button" data-i18n="roomPresets.cancel">取消</button><button id="confirmNewProject" type="button" data-i18n="roomPresets.createProject">创建项目</button></div></dialog>
<dialog id="exportDialog" class="export-dialog">
 <div class="export-heading"><h2>导出</h2><button type="button" data-export-close>关闭</button></div>
 <section class="export-section"><h3>导出内容</h3>
  <div class="export-modes"><label><input type="radio" name="exportScope" value="project" checked>迭代器项目</label><label><input type="radio" name="exportScope" value="region">整片区域</label></div>
  <div id="export-projectContent">
   <div class="export-projects-heading"><span>作品</span><div><button id="pack-all" type="button">全选</button><button id="pack-none" type="button">清空选择</button></div></div><div id="pack-projects" class="export-projects"></div>
    <div class="export-parts"><label data-project-part><input type="checkbox" name="part" value="appearance" checked>外观参数</label><label data-project-part><input type="checkbox" name="part" value="textures" checked>分层素材与合成 PNG</label><label data-project-part><input type="checkbox" name="part" value="room" checked>房间</label><label><input id="pack-dialogue" type="checkbox" name="part" value="dialogue" checked>对话文本</label></div>
   <div id="export-roomContent"><div id="export-matchedRooms" class="export-matched"></div>
    <details id="export-extraRooms"><summary>额外房间</summary><input id="export-roomSearch" type="search" placeholder="检索房间或区域" aria-label="检索房间或区域"><div id="export-roomChoices" class="export-room-choices"></div></details>
   </div>
   <details id="export-associated"><summary>关联内容</summary><div class="export-parts"><label><input id="pack-workPearls" type="checkbox">工作珍珠</label><label><input id="pack-pearls" type="checkbox">关联的可读取珍珠</label><label><input id="pack-broadcasts" type="checkbox">所选房间的广播</label><label><input id="pack-projections" type="checkbox">投影动画</label></div><label id="pack-pearlCollectionField" hidden>珍珠项目<select id="pack-pearlCollection" aria-label="导出的珍珠项目"></select></label></details>
  </div>
  <div id="export-regionContent" hidden><label>区域<select id="export-region" aria-label="导出的区域"></select></label><div id="export-regionSummary"></div></div>
 </section>
  <div id="export-roomReviewAnchor"></div><section class="export-section"><h3>导出格式</h3><div id="export-formats" class="export-formats"><label><input type="radio" name="exportFormat" value="project" checked>项目 ZIP</label><label><input type="radio" name="exportFormat" value="mod">独立游玩模组</label><label><input type="radio" name="exportFormat" value="playable">导出完整地图模组</label><label><input type="radio" name="exportFormat" value="assets">素材 ZIP</label><label id="export-regionFormat"><input type="radio" name="exportFormat" value="region">地区 ZIP</label></div><p id="export-formatNote" class="muted" hidden></p><button id="export-completeContent" type="button" hidden data-i18n="export.completeContent">选入完整项目内容</button>
  <label id="export-startRoomField" hidden>起始房间<select id="export-startRoom" aria-label="起始房间"></select></label>
   <details id="pack-metadata" hidden><summary>模组信息</summary><div class="export-metadata"><label>模组 ID<input id="pack-id" placeholder="author.myiterator"></label><label>模组名称<input id="pack-name" maxlength="100"></label><label>作者<input id="pack-authors" maxlength="200"></label><label>版本<input id="pack-version" placeholder="0.1.0"></label><label class="export-description">简介<textarea id="pack-description" maxlength="4000" rows="2"></textarea></label></div></details><details id="pack-sceneAssets" hidden><summary id="export-coverTitle">封面</summary><div class="export-metadata"><label>封面<input id="pack-cover" type="file" accept="image/png,image/jpeg"></label><div><img id="pack-coverPreview" alt="模组封面" hidden><button id="pack-clearCover" type="button">无封面</button></div></div><div id="pack-sceneEditor"></div></details>
 </section>
 <div id="export-review" hidden></div><div class="export-footer"><p id="pack-status" role="status"></p><button id="pack-build" class="accent" type="button">检查并导出</button></div>
</dialog>
<dialog id="historyDialog"><h2>项目历史</h2><div id="historyList"></div><button onclick="this.closest('dialog').close()">关闭</button></dialog><input id="fileInput" type="file" hidden><script src="/legacy-preview.js"></script><script src="/pearl-icons.js"></script><script src="/necklaces.js"></script><script src="/wardrobe.js"></script><script src="/hand-texture-base.js"></script><script src="/puppet-arms.js"></script><script src="/sleeve-mapping.js"></script><script src="/workspace.js"></script><script src="/pearl-accessories.js"></script><script src="/head-segments.js"></script><script src="/eyes.js"></script><script src="/color-gradients.js"></script><script src="/audio-settings.js"></script><script src="/voice-sequence.js"></script><script src="/voice-audio.js"></script><script src="/voice-settings.js"></script><script src="/paint-composite.js"></script><script src="/paint-layers.js"></script><script src="/paint-targets.js"></script><script src="/studio-undo.js"></script><script src="/app.js"></script><script src="/project-actions.js"></script><script src="/preview-background.js"></script><script src="/scene-assets.js"></script><script src="/standalone.js"></script><script src="/studio-navigation.js"></script><script src="/studio-chrome.js"></script><script src="/install-settings.js"></script><script src="/studio-about.js"></script></body></html>
