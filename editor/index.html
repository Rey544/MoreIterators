<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>外观调整</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script><link rel="stylesheet" href="/studio-status.css"><script src="/studio-status.js"></script><link rel="stylesheet" href="/studio-theme.css"><link rel="stylesheet" href="/studio-about.css"><link rel="stylesheet" href="/voice-settings.css"><link rel="stylesheet" href="/project-actions.css"></head><body class="appearance-studio mi-studio">
<header>
 <strong class="studio-title">外观调整</strong>
 <div class="project-actions"><select id="projects" aria-label="已保存项目"></select><button id="new">新建项目</button><button id="import">导入项目</button><button id="history">历史版本</button><button id="deleteProject" class="danger" type="button" disabled>删除项目</button><details class="studio-menu"><summary>更多</summary><nav><button id="recentlyDeleted" type="button">最近删除</button></nav></details></div>
 <div class="save-actions"><button id="save">保存</button><button id="export">导出</button><button class="accent" id="apply">应用到游戏</button></div>
 <details id="otherStudios" class="studio-menu"><summary>切换页面</summary><nav aria-label="切换页面"><a href="/pearls" target="_blank">珍珠文本</a><button id="dialogueEditor">对话编辑</button><a href="/broadcasts" target="_blank">广播编辑</a><a id="projectionStudio" href="/projections" target="_blank">投影编辑</a><a id="roomStudio" href="/rooms" target="_blank">区域连接</a></nav></details>
</header>
<div id="notice" role="status" hidden></div>
<main id="workspace" aria-label="迭代器外观工作区">
 <aside id="settings" aria-label="外观分类与参数">
  <label class="name">项目名称<input id="projectName" maxlength="60"></label>
  <details class="room-edit"><summary>房间工程</summary><p class="muted" id="identity"></p><p data-i18n="appearance.roomWorkflow">打开 Rained → 选择等待房间或演算室 → 编辑并保存 → 同步</p><div class="tools"><button id="editEntry">打开等待房间</button><button id="syncEntry">同步等待房间</button><button id="editAI">打开演算室</button><button id="syncAI">同步演算室</button></div></details>
  <div id="groups"></div>
 </aside>
 <div id="settingsDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整外观栏宽度" aria-orientation="vertical" aria-controls="settings" aria-valuemin="240" aria-valuemax="600" aria-valuenow="280" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div>
 <section class="preview" aria-labelledby="previewTitle">
  <div class="panel-heading"><h2 id="previewTitle">离线人偶</h2><div class="preview-actions">
   <details id="previewBackground" class="studio-menu"><summary>背景</summary><div class="background-panel"><select id="backgroundMode" aria-label="背景类型"><option value="solid">纯色</option><option value="checker">透明方格</option></select><div id="backgroundSpectrum"><div id="backgroundSV" role="slider" tabindex="0" aria-label="背景饱和度与明度" aria-valuemin="0" aria-valuemax="100"><span id="backgroundCursor"></span></div><input id="backgroundHue" type="range" min="0" max="360" step="1" aria-label="背景色相"></div></div></details>
   <details id="referenceGuides" class="studio-menu"><summary>参考线</summary><div class="background-panel"><label><input id="guides" type="checkbox" checked>显示参考线</label><label class="field"><span>参考线颜色</span><input id="guideColor" type="color" value="#ffffff" aria-label="参考线颜色"></label></div></details>
  </div></div>
  <div class="zoom-toolbar" role="group" aria-label="人偶视图缩放"><button id="zoomOut" class="zoom-step" aria-label="缩小人偶">−</button><input id="zoom" type="range" min=".25" max="20" value="5" step=".01" aria-label="人偶缩放"><label class="zoom-number"><input id="zoomValue" type="number" min="25" max="2000" step="1" value="500" aria-label="人偶缩放百分比"><span aria-hidden="true">%</span></label><button id="zoomIn" class="zoom-step" aria-label="放大人偶">+</button><button id="fitPreview">适合窗口</button></div>
  <div id="previewStage" class="preview-stage"><canvas id="puppet" width="580" height="600" aria-label="离线人偶预览，可拖动平移" title="拖动平移 · Ctrl + 滚轮缩放"></canvas></div>
  <div id="previewHeightDivider" class="workspace-height-divider" role="separator" tabindex="0" aria-label="上下拖动调整工作区高度" aria-orientation="horizontal" title="上下拖动调整高度 · 双击恢复"></div>
 </section>
 <div id="paintDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整绘制栏宽度" aria-orientation="vertical" aria-controls="paintPanel" aria-valuemin="300" aria-valuemax="700" aria-valuenow="520" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div>
 <section id="paintPanel" class="paint" aria-labelledby="paintTitle">
  <div class="paint-split"><div class="paint-editor">
  <div class="panel-heading paint-heading"><h2 id="paintTitle">绘制素材</h2><select id="target" aria-label="绘制部位"><option value="forehead">额头纹案</option><option value="face">脸部纹案</option><option value="antennaL">左天线</option><option value="antennaR">右天线</option><option value="earL">左耳机</option><option value="earR">右耳机</option><option value="gown">长袍 UV</option><option value="sleeve">袖子 UV</option><option value="collar">领子 UV</option><option value="scarf">后围巾 UV</option></select></div>
  <div class="zoom-toolbar paint-zoom" role="group" aria-label="素材画布缩放"><button id="paintZoomOut" class="zoom-step" aria-label="缩小素材">−</button><input id="paintZoom" type="range" min=".25" max="32" value="8" step=".01" aria-label="素材缩放"><label class="zoom-number"><input id="paintZoomValue" type="number" min="25" max="3200" step="1" value="800" aria-label="素材缩放百分比"><span aria-hidden="true">%</span></label><button id="paintZoomIn" class="zoom-step" aria-label="放大素材">+</button></div>
  <div class="paint-tools" role="group" aria-label="绘画工具">
   <div class="tool-colors"><select id="brush" aria-label="画笔"><option value="pen">像素笔</option><option value="line">直线</option><option value="spray">喷枪</option><option value="grain">颗粒笔</option><option value="gradient">渐变</option><option value="erase">橡皮</option></select><input type="color" id="ink" value="#eeeeee" aria-label="画笔颜色" title="画笔颜色"><input type="color" id="ink2" value="#a4394c" aria-label="渐变终点颜色" title="渐变终点颜色"><button id="undo" title="撤销编辑（Ctrl+Z）" aria-keyshortcuts="Control+Z Meta+Z">撤销</button><button id="redo" title="重做编辑（Ctrl+Shift+Z / Ctrl+Y）" aria-keyshortcuts="Control+Shift+Z Control+Y Meta+Shift+Z">重做</button></div>
   <div class="paint-material-row"><div class="paint-toggles"><label><input type="checkbox" id="symmetry">左右对称</label><label><input id="meshGuide" type="checkbox" checked>网格与部位参考</label></div><details class="studio-menu texture-menu"><summary>素材操作</summary><div class="texture-actions"><button id="textureImport">导入 PNG 到此层</button><button id="textureExport">导出合成 PNG</button><button id="baseGradient">生成当前配色底图</button><button id="antennaShape" hidden>载入此层基础形状</button><button id="mirrorAntenna">镜像到另一侧天线</button><button id="clear" class="danger">清空此层</button></div></details></div>
  </div>
  <div class="paint-canvas-row"><div class="paint-brush-rails"><label class="paint-size-rail"><span>笔径</span><output id="sizeValue" for="size">2</output><input type="range" id="size" min="1" max="24" value="2" aria-label="笔径" aria-orientation="vertical"></label><label class="paint-size-rail paint-strength-rail"><span>浓度</span><output id="strengthValue" for="strength">100%</output><input type="range" id="strength" min=".02" max="1" step=".02" value="1" aria-label="浓度" aria-orientation="vertical"></label></div><div id="paintViewport" class="paint-wrap" tabindex="0" aria-label="素材画布，可滚动查看放大区域"><div id="paintSurface"><canvas id="paint" width="256" height="256" aria-label="像素绘制画布"></canvas></div></div></div>
  <div id="paintHeightDivider" class="workspace-height-divider" role="separator" tabindex="0" aria-label="上下拖动调整画布高度" aria-orientation="horizontal" title="上下拖动调整高度 · 双击恢复"></div>
  </div><div id="layersDivider" class="workspace-divider" role="separator" tabindex="0" aria-label="调整贴图图层栏宽度" aria-orientation="vertical" aria-controls="paintLayers" aria-valuemin="96" aria-valuemax="320" aria-valuenow="128" title="拖动调整栏宽，方向键微调，双击恢复默认宽度"></div><aside id="paintLayers" class="paint-layers" aria-label="贴图图层"><div class="layer-heading"><h3>贴图图层</h3><div class="layer-actions"><button id="layerAdd" type="button" aria-label="新建图层" title="新建图层">＋</button><button id="layerDelete" type="button" aria-label="删除图层" title="删除图层">−</button></div></div><div id="layerList"></div></aside></div>
 </section>
</main>
<dialog id="exportDialog"><h2>导出</h2><button id="openPlayableExport" class="accent">独立游玩模组</button><h3>可编辑项目与素材</h3><label><input type="checkbox" name="part" value="appearance" checked>外观参数</label><label><input type="checkbox" name="part" value="textures" checked>分层素材与合成 PNG</label><label><input type="checkbox" name="part" value="room" checked>房间、珍珠与主题配色</label><label><input type="checkbox" name="part" value="dialogue" checked>对话文本</label><div class="tools"><button id="projectExport">完整可编辑项目 JSON</button><button id="bundleExport" class="accent">导出所选素材包</button><button onclick="this.closest('dialog').close()">关闭</button></div></dialog>
<dialog id="playableExportDialog"><h2>独立游玩模组</h2><div class="pack-grid"><section><h3>作品</h3><div class="tools"><button id="pack-all">全选</button><button id="pack-none">清空选择</button></div><div id="pack-projects"></div><h3>内容</h3><label><input id="pack-dialogue" type="checkbox">剧情与通用对话</label><label><input id="pack-pearls" type="checkbox">关联的可读取珍珠</label><label id="pack-pearlCollectionField" hidden>珍珠项目<select id="pack-pearlCollection" aria-label="导出的珍珠项目"></select></label><label><input id="pack-workPearls" type="checkbox">工作珍珠</label><label><input id="pack-broadcasts" type="checkbox">所选房间的广播</label><label><input id="pack-projections" type="checkbox" checked>投影动画</label></section><section><h3>拓展菜单信息</h3><label>模组 ID<input id="pack-id" placeholder="author.myiterator"></label><label>模组名称<input id="pack-name" maxlength="100"></label><label>作者<input id="pack-authors" maxlength="200"></label><label>版本<input id="pack-version" placeholder="0.1.0"></label><label>简介<textarea id="pack-description" maxlength="4000" rows="4"></textarea></label><label>封面<input id="pack-cover" type="file" accept="image/png,image/jpeg"></label><img id="pack-coverPreview" alt="模组封面" hidden><button id="pack-clearCover">无封面</button></section></div><div class="tools"><button id="pack-build" class="accent">编译并导出</button><button onclick="this.closest('dialog').close()">关闭</button></div><p id="pack-status" role="status"></p></dialog>
<dialog id="historyDialog"><h2>项目历史</h2><div id="historyList"></div><button onclick="this.closest('dialog').close()">关闭</button></dialog><input id="fileInput" type="file" hidden><script src="/legacy-preview.js"></script><script src="/pearl-icons.js"></script><script src="/necklaces.js"></script><script src="/wardrobe.js"></script><script src="/hand-texture-base.js"></script><script src="/puppet-arms.js"></script><script src="/sleeve-mapping.js"></script><script src="/workspace.js"></script><script src="/pearl-accessories.js"></script><script src="/head-segments.js"></script><script src="/eyes.js"></script><script src="/color-gradients.js"></script><script src="/audio-settings.js"></script><script src="/voice-sequence.js"></script><script src="/voice-audio.js"></script><script src="/voice-settings.js"></script><script src="/paint-layers.js"></script><script src="/paint-targets.js"></script><script src="/studio-undo.js"></script><script src="/app.js"></script><script src="/project-actions.js"></script><script src="/preview-background.js"></script><script src="/standalone.js"></script><script src="/studio-navigation.js"></script><script src="/studio-chrome.js"></script><script src="/studio-about.js"></script></body></html>
