<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广播编辑</title><link rel="stylesheet" href="/pearls.css"><link rel="stylesheet" href="/broadcasts.css"><script src="/i18n.js"></script><link rel="stylesheet" href="/studio-status.css"><script src="/studio-status.js"></script><link rel="stylesheet" href="/studio-theme.css"><link rel="stylesheet" href="/studio-about.css"></head><body class="mi-studio broadcast-studio">
<header><strong>广播编辑</strong><button id="save">保存</button><button id="apply">应用到游戏</button><details class="more-menu" id="broadcastMore"><summary>更多</summary><nav><button id="new">新建广播</button><button id="import">导入 JSON</button><button id="export">导出 JSON</button></nav></details><details class="more-menu" id="broadcastStudios"><summary>切换页面</summary><nav><a href="/">外观调整</a><a href="/pearls">珍珠文本</a><a href="/dialogue">对话编辑</a><a id="projectionStudio" href="/projections">投影编辑</a><a id="roomStudio" href="/rooms">区域连接</a></nav></details></header>
<p id="notice" role="status">正在加载…</p><main>
<aside class="broadcast-library"><div class="library-heading"><h2>广播</h2><button id="newBroadcast">新建</button></div><select id="saved" aria-label="已保存广播" hidden></select><div id="broadcastList" aria-label="广播列表"></div></aside>
<section class="broadcast-detail">
<div class="broadcast-identity"><label>名称<input id="name" maxlength="100"></label><label>广播 ID<input id="id" maxlength="32" placeholder="B01"></label></div>
<div class="broadcast-settings"><label>字体<select id="font"><option value="normal">原版普通</option><option value="display">原版标题</option></select></label><label>字号倍数<input id="size" type="number" required min=".5" max="2" step=".1"></label><label>播放速度<input id="speed" type="number" required min=".25" max="4" step=".25"></label><label>读完停留秒<input id="hold" type="number" required min=".1" max="60" step=".1"></label><label class="color-switch"><input id="useCharacterColors" type="checkbox">彩色广播</label></div>
<details class="speaker-bindings" open><summary>角色颜色</summary><div id="speakers"></div><button id="addSpeaker">绑定角色</button></details>
<div class="broadcast-editor-grid"><section class="broadcast-text"><h2>广播文本</h2><div class="bar page-controls"><select id="page" aria-label="当前编辑页"></select><button id="addPage">新增一页</button><details class="page-menu"><summary>页面操作</summary><nav><button id="deletePage">删除本页</button><button id="pageUp">前移本页</button><button id="pageDown">后移本页</button></nav></details></div><div id="lines"></div><button id="addLine">新增一句</button></section>
<aside class="broadcast-preview-column"><h2>文本试播</h2><div class="bar"><button id="play">从本页播放</button><button id="stop">停止</button><button id="previous">上一页</button><button id="next">下一页</button></div><p id="playState" class="hint"></p><div id="preview" aria-live="polite"></div>
<details class="broadcast-placement"><summary>广播位置</summary><div class="placement-fields"><label>地区<select id="region"></select></label><label>房间<select id="room"></select></label></div><button id="refreshRooms">刷新已启用房间</button><canvas id="map" width="720" height="360" aria-label="房间结构与广播位置" title="点击放置广播"></canvas><div class="bar"><label>横向 %<input id="x" type="number" min="0" max="100" step=".1"></label><label>高度 %<input id="y" type="number" min="0" max="100" step=".1"></label></div><p id="position" class="hint"></p></details></aside></div>
</section>
</main><dialog id="importPicker"><form method="dialog"><h2>选择广播</h2><select id="importChoice" aria-label="要导入的广播"></select><div class="bar"><button id="confirmImport" type="button">导入所选广播</button><button value="cancel">取消</button></div></form></dialog><input id="file" type="file" accept="application/json,.json" hidden><script src="/studio-undo.js"></script><script src="/broadcasts.js"></script><script src="/studio-navigation.js"></script><script src="/studio-chrome.js"></script><script src="/studio-about.js"></script></body></html>
